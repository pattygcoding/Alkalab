name: Deploy

# Builds the Nim wasm package, runs the native test suite, and publishes
# nim/web/ to GitHub Pages. Enable Pages once in the repository settings with
# "Source: GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Nim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Test the simulation core natively
        run: nim c -r --hints:off --warnings:off nim/tests/alkalab_tests.nim

      - name: Build for the web (nim/web/pkg/alkalab.wasm)
        run: node nim/build.mjs

      - name: Smoke test the wasm module in Node
        run: node nim/tests/wasm_smoke.mjs

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: nim/web

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
