[package]
name = "alkalab"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Alkalab - a falling-sand / cellular-automata chemistry lab compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/PATTY/Alkalab"
keywords = ["wasm", "game", "simulation", "cellular-automata", "falling-sand"]
categories = ["games", "simulation", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The simulation core (everything except `lib.rs`) is pure `std` Rust so that
# `cargo test` can run natively. wasm-bindgen only touches the thin wrapper.
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# rustc emits bulk-memory instructions (memory.copy/memory.fill) for slice and
# Vec operations, which the default wasm-opt feature set rejects. Enabling them
# lets the post-processing pass run (it shaves a few hundred bytes off the
# module and is what the wasm-bindgen toolchain expects of modern Rust output).
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-mutable-globals",
    "--enable-sign-ext",
]
